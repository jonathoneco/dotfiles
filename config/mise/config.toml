[tools]
gcloud = "latest"
uv = "latest"
go = "latest"
lua = "latest"
node = "lts"
python = "latest"
fzf = "latest"
rust = "latest"
yq = "latest"
bun = "latest"
deno = "latest"
neovim = "latest"
lazygit = "latest"
starship = "latest"
eza = "latest"
zoxide = "latest"
bat = "latest"
ripgrep = "latest"
fd = "latest"
gh = "latest"
tree-sitter = "latest"
stylua = "latest"
"npm:prettier" = "latest"
shellcheck = "latest"
zig = "0.15.2"
# Matches the k3s server on garden-pop; kubectl supports one minor version of skew.
kubectl = "1.36.5"
"aqua:nextest-rs/nextest/cargo-nextest" = "latest"
just = "latest"

[settings]
# Every checkout and worktree under ~/src, and the worktrees T3 Code makes for
# its conversations under ~/.t3/worktrees.
trusted_config_paths = ["~/src", "~/.herdr/worktrees/wrangle", "~/.t3/worktrees"]
