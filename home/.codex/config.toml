model = "gpt-5.6-luna"
model_reasoning_effort = "medium"
approval_policy = "on-request"
sandbox_mode = "danger-full-access"

[shell_environment_policy]
inherit = "all"

service_tier = "default"

[features]
hooks = true
multi_agent = true
js_repl = false

[tui]
animations = false
terminal_title = ["activity", "run-state", "project"]

hooks = true
pet = "disabled"

[general]
project_doc_fallback_filenames = ["CLAUDE.md"]

[plugins."code-review@claude-plugins-official"]
enabled = true

[plugins."code-simplifier@claude-plugins-official"]
enabled = true

[plugins."commit-commands@claude-plugins-official"]
enabled = true

[plugins."context7@claude-plugins-official"]
enabled = true

[plugins."feature-dev@claude-plugins-official"]
enabled = true

[plugins."greptile@claude-plugins-official"]
enabled = true

[plugins."greptile@claude-plugins-official".mcp_servers.greptile.tools.get_merge_request]
approval_mode = "approve"

[plugins."pr-review-toolkit@claude-plugins-official"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."hookify@claude-plugins-official"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true
